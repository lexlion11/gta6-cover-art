<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Snap — GTA-Style Cover Art Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <section id="stage">
      <div id="canvas-wrap">
        <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
      </div>
      <p id="hint">Live preview — your cover updates as you edit.</p>
    </section>

    <aside id="sidebar">
      <h1>Cover&nbsp;Snap</h1>
      <p class="tag">Vice City cover-art maker</p>

      <fieldset>
        <legend>Photo</legend>
        <label class="file-btn">
          Choose photos…
          <input type="file" id="photo-input" accept="image/*" multiple hidden>
        </label>
        <button id="sample-btn" type="button">Load sample photos</button>
        <p id="photo-count">No photos loaded.</p>
      </fieldset>

      <fieldset>
        <legend>Caption</legend>
        <input type="text" id="caption" maxlength="24" value="VICE CITY" placeholder="VICE CITY">
      </fieldset>

      <fieldset>
        <legend>Size</legend>
        <div class="btn-row" id="size-buttons">
          <button type="button" data-w="1080" data-h="1080" class="active">1080×1080</button>
          <button type="button" data-w="1080" data-h="1350">1080×1350</button>
          <button type="button" data-w="1920" data-h="1080">1920×1080</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Export</legend>
        <button id="export-btn" type="button" class="primary">Export cover</button>
      </fieldset>
    </aside>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
